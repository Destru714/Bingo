<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo 3x3</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
        }

        .bingo {
            display: grid;
            grid-template-columns: repeat(3, 150px);
            gap: 8px;
            justify-content: center;
            margin: 30px auto;
        }

        .casilla {
            height: 150px;
            border: 2px solid black;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            user-select: none;
        }

        .casilla.marcada {
            background: #7ed957;
            text-decoration: line-through;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        @media (max-width: 520px) {
            .bingo {
                grid-template-columns: repeat(3, 30vw);
            }

            .casilla {
                height: 30vw;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <h1>Bingo</h1>

    <div class="bingo">
        <div class="casilla">Texto 1</div>
        <div class="casilla">Texto 2</div>
        <div class="casilla">Texto 3</div>

        <div class="casilla">Texto 4</div>
        <div class="casilla">Texto 5</div>
        <div class="casilla">Texto 6</div>

        <div class="casilla">Texto 7</div>
        <div class="casilla">Texto 8</div>
        <div class="casilla">Texto 9</div>
    </div>

    <button onclick="reiniciar()">Reiniciar</button>

    <script>
        const casillas = document.querySelectorAll(".casilla");

        casillas.forEach(function(casilla) {
            casilla.addEventListener("click", function() {
                casilla.classList.toggle("marcada");
            });
        });

        function reiniciar() {
            casillas.forEach(function(casilla) {
                casilla.classList.remove("marcada");
            });
        }
    </script>

</body>
</html>
