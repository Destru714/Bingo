<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo 3x3</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: black;
            color: white;
        }

        h1 {
            margin-top: 25px;
        }

        .bingo {
            display: grid;
            grid-template-columns: repeat(3, 170px);
            gap: 8px;
            justify-content: center;
            margin: 30px auto;
        }

        .casilla {
            height: 170px;
            padding: 10px;
            box-sizing: border-box;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px solid white;
            border-radius: 15px;

            background-color: black;
            color: white;

            font-size: 18px;
            font-weight: bold;
            text-align: center;

            cursor: pointer;
            user-select: none;
        }

        .casilla.marcada {
            background-color: green;
        }

        button {
            padding: 10px 20px;
            border: 1px solid white;
            border-radius: 15px;
            background-color: black;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #333333;
        }

        @media (max-width: 600px) {
            .bingo {
                grid-template-columns: repeat(3, 30vw);
            }

            .casilla {
                width: 30vw;
                height: 30vw;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <h1>
    Bingo de <span id="tituloEditable"></span>
    </h1>

    <div class="bingo">
        <div class="casilla">Texto 1</div>
        <div class="casilla">Texto 2</div>
        <div class="casilla">Texto 3</div>

        <div class="casilla">Texto 4</div>
        <div class="casilla">Texto 5</div>
        <div class="casilla">Texto 6</div>

        <div class="casilla">Texto 7</div>
        <div class="casilla">Texto 8</div>
        <div class="casilla">Texto 9</div>
    </div>

    <button type="button" onclick="reiniciar()">Reiniciar marcas</button>

    <script>
        const casillas = document.querySelectorAll(".casilla");

        const tituloEditable = document.getElementById("tituloEditable");
        const tituloGuardado = localStorage.getItem("tituloBingo");

        if (tituloGuardado !== null) {
            tituloEditable.textContent = tituloGuardado;
        }

        tituloEditable.addEventListener("contextmenu", function(event) {
            event.preventDefault();

            tituloEditable.contentEditable = "true";
            tituloEditable.focus();
        });

        tituloEditable.addEventListener("blur", function() {
            tituloEditable.contentEditable = "false";

            const texto = tituloEditable.textContent.trim();

            tituloEditable.textContent = texto;
            localStorage.setItem("tituloBingo", texto);
        });

        tituloEditable.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                tituloEditable.blur();
            }
        });

        casillas.forEach(function(casilla, indice) {
            const textoGuardado =
                localStorage.getItem("bingoTexto" + indice);

            const estadoGuardado =
                localStorage.getItem("bingoMarcada" + indice);

            if (textoGuardado !== null) {
                casilla.textContent = textoGuardado;
            }

            if (estadoGuardado === "true") {
                casilla.classList.add("marcada");
            }

            // Clic izquierdo: marcar o desmarcar
            casilla.addEventListener("click", function() {
                if (!casilla.isContentEditable) {
                    casilla.classList.toggle("marcada");

                    localStorage.setItem(
                        "bingoMarcada" + indice,
                        casilla.classList.contains("marcada")
                    );
                }
            });

            // Clic derecho: editar directamente dentro de la casilla
            casilla.addEventListener("contextmenu", function(event) {
                event.preventDefault();

                casilla.contentEditable = "true";
                casilla.focus();

                const rango = document.createRange();
                const seleccion = window.getSelection();

                rango.selectNodeContents(casilla);
                seleccion.removeAllRanges();
                seleccion.addRange(rango);
            });

            // Guardar al hacer clic fuera
            casilla.addEventListener("blur", function() {
                casilla.contentEditable = "false";

                const texto = casilla.textContent.trim();

                if (texto !== "") {
                    casilla.textContent = texto;
                    localStorage.setItem("bingoTexto" + indice, texto);
                }
            });

            // Guardar pulsando Enter
            casilla.addEventListener("keydown", function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    casilla.blur();
                }
            });
        });

        function reiniciar() {
            casillas.forEach(function(casilla, indice) {
                casilla.classList.remove("marcada");

                localStorage.setItem(
                    "bingoMarcada" + indice,
                    "false"
                );
            });
        }
    </script>

</body>
</html>
